services:
  db:
    image: pgvector/pgvector:pg17
    container_name: acuitytalent-db
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: TVVWaGVqQTk=
      POSTGRES_DB: acuitytalentdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d acuitytalentdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: acuitytalent-ai
    environment:
      DATABASE_URL: postgresql://prisma:TVVWaGVqQTk=@db:5432/acuitytalentdb
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acuitytalent-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://prisma:TVVWaGVqQTk=@db:5432/acuitytalentdb
      AI_SERVICE_URL: http://ai:8000/api
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
        NEXT_PUBLIC_IS_PROD: "1"
    container_name: acuitytalent-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  db_data:
  backend_uploads:
